<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow — วางแผนงานเรียน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Caveat:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="brand">StudyFlow</h1>
    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="dashboard" type="button">ภาพรวม</button>
      <button class="tab-btn" data-tab="chart" type="button">แผนภูมิ PERT</button>
      <button class="tab-btn" data-tab="calendar" type="button">ปฏิทิน</button>
    </nav>
    <button class="btn btn-primary" id="add-task-btn" type="button">+ เพิ่มงาน</button>
  </header>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <main>
    <section id="panel-dashboard" class="panel active">
      <div id="up-next-slot"></div>
      <div class="stats-row" id="stats-row"></div>
      <table class="task-table">
        <thead>
          <tr><th class="col-check"></th><th>งาน</th><th>กำหนดส่ง</th><th>ทำหลังจาก</th><th>สถานะ</th></tr>
        </thead>
        <tbody id="task-list-body"></tbody>
      </table>
      <p class="empty-hint" id="empty-hint" hidden>ยังไม่มีงาน — ลองเพิ่มงานแรกของคุณ</p>
    </section>

    <section id="panel-chart" class="panel">
      <div class="chart-toolbar">
        <div class="crit-label">เส้นทางวิกฤต: <span id="chart-critical-path">—</span></div>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <svg id="pert-svg"></svg>
        <div id="pert-nodes" class="pert-nodes"></div>
        <div id="chart-tooltip" class="chart-tooltip" hidden></div>
        <p class="empty-hint" id="chart-empty-hint" hidden>เพิ่มงานและกำหนดวันส่งเพื่อดูแผนภูมิ</p>
      </div>
    </section>

    <section id="panel-calendar" class="panel">
      <div class="cal-toolbar">
        <button id="cal-prev" class="btn btn-ghost" type="button">‹</button>
        <div id="cal-range-label" class="cal-range-label"></div>
        <button id="cal-next" class="btn btn-ghost" type="button">›</button>
        <button id="cal-today" class="btn btn-ghost" type="button">วันนี้</button>
      </div>
      <div class="cal-weekdays" id="cal-weekdays"></div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-critical" id="cal-critical"></div>
    </section>
  </main>
</div>

<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title">เพิ่มงาน</h2>
      <button class="icon-btn" id="modal-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span class="field-label">ชื่องาน</span>
        <input type="text" id="field-name" placeholder="เช่น ส่งร่างรายงาน" maxlength="80">
      </label>
      <label class="field">
        <span class="field-label">กำหนดส่ง</span>
        <input type="date" id="field-due">
        <span class="field-hint">ต้องไม่เร็วกว่าวันนี้</span>
        <span class="field-error" id="date-error" hidden></span>
      </label>
      <fieldset class="pert-fields">
        <legend>ประมาณการแบบ PERT (วัน)</legend>
        <label class="mini-field"><span>เร็วที่สุด (O)</span><input type="number" id="field-optimistic" min="1" max="365" value="1"></label>
        <label class="mini-field"><span>เป็นไปได้มากสุด (M)</span><input type="number" id="field-most-likely" min="1" max="365" value="1"></label>
        <label class="mini-field"><span>ช้าที่สุด (P)</span><input type="number" id="field-pessimistic" min="1" max="365" value="1"></label>
        <span class="field-hint pert-hint">ต้องเป็น O ≤ M ≤ P</span>
        <span class="field-error" id="estimate-error" hidden></span>
      </fieldset>
      <div class="field">
        <span class="field-label">ต้องทำหลังจาก</span>
        <div class="chip-row" id="deps-chip-row"></div>
        <span class="field-hint">รายการสีเทาจะทำให้ลำดับงานวนซ้ำ</span>
      </div>
      <div class="preview-box" id="preview-box"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="modal-save" type="button">บันทึก</button>
      <button class="btn btn-ghost" id="modal-cancel" type="button">ยกเลิก</button>
      <button class="btn btn-danger" id="modal-delete" type="button" hidden>ลบ</button>
    </div>
  </div>
</div>

<script src="schedule-core.js"></script>
<script src="script.js"></script>
</body>
</html>
